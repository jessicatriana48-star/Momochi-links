<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momochi Ice Cream</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8f8f1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    padding: 24px 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 36px 28px 28px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 8px 40px rgba(52, 199, 130, 0.12);
  }
  .logo-wrapper { width: 260px; margin-bottom: -30px; }
  .logo-wrapper img { width: 100%; height: auto; display: block; }
  .tagline { font-size: 14px; color: #666; margin-bottom: 4px; text-align: center; }
  .location-block { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 14px; }
  .location-city { font-size: 13px; color: #34c782; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .location-city svg { flex-shrink: 0; }
  .location-address { font-size: 12.5px; color: #999; text-align: center; }
  .social-icons { display: flex; gap: 20px; margin-bottom: 24px; }
  .social-icon {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid #34c782; display: flex; align-items: center;
    justify-content: center; color: #34c782; text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .social-icon:hover { background: #34c782; color: white; }
  .social-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px; border-radius: 50px; font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 700; text-decoration: none;
    background: #34c782; color: white; border: none;
    transition: transform 0.15s, opacity 0.15s; cursor: pointer;
  }
  .btn:hover { transform: scale(1.02); opacity: 0.93; }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .footer { margin-top: 24px; font-size: 12px; color: #bbb; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
</style>
</head>
